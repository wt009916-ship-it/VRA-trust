services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      DEMO_MODE: "false"
      ENERGYPLUS_EXE: "/opt/energyplus/energyplus"
      VRA_DATA_DIR: "/app/runtime"
      VRA_MAX_UPLOAD_MB: "20"
    volumes:
      - vra-data:/app/runtime
      - ${ENERGYPLUS_LINUX_DIR:?Set a Linux EnergyPlus 9.0.1 installation directory}:/opt/energyplus:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  vra-data:
